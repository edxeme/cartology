[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cartology"
version = "0.1.0"
description = "Code cartography for Python projects — static maps of imports, complexity, dead code and runtime behaviour."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Edwin Martínez" }]
keywords = ["static-analysis", "ast", "import-graph", "complexity", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/edxeme/cartology"

[project.scripts]
cartology = "cartology.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/cartology"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
